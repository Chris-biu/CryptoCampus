openapi: 3.1.0
info:
  title: CryptoCampus API
  version: 1.0.0
  description: |
    团队 01 的 HTTP 接口唯一机器可读契约。所有业务接口以 /api/v1 为前缀。
    修改字段、类型、错误码或权限前，必须先评审本文件。
x-course-scope:
  core: FR-01 至 FR-11 的课程功能
  advanced: 安全聊天、ML-DSA、PDF 附加签章页、公平盲签名仅按课程选做能力标注
  later-production: PostgreSQL、Redis、对象存储、任务队列与可观测性不进入本契约
x-fr-coverage:
  FR-01: ["/system/status", "/auth/register/request-code", "/auth/register", "/auth/login", "/auth/refresh", "/auth/logout"]
  FR-02: ["/me", "/me/pqc-mode", "/me/keyring", "/me/certificate/verify", "/me/keyring/export", "/me/keyring/import", "/me/keyring/rotate"]
  FR-03: ["/drops/text", "/drops/file"]
  FR-04: ["/drops/{code}", "/drops/{code}/extract", "/me/notifications"]
  FR-05: ["/hole/posts", "/hole/credentials", "/hole/credentials/commitments", "/hole/credentials/verify", "/hole/posts/{post_id}/comments", "/hole/posts/{post_id}/likes", "/hole/revocations", "/admin/fair-blind/reveal-requests", "/admin/fair-blind/reveal-requests/{reveal_request_id}/approve"]
  FR-06: ["/votes", "/votes/{vote_id}", "/votes/{vote_id}/credentials/commitments", "/votes/{vote_id}/credentials", "/votes/{vote_id}/ballots", "/votes/{vote_id}/results", "/votes/{vote_id}/results/verify", "/votes/{vote_id}/audit"]
  FR-07: ["/seals", "/seals/{seal_id}", "/seals/{seal_id}/sidecar", "/verifications"]
  FR-08: ["/chat/sessions", "/chat/sessions/{chat_session_id}/messages", "/chat/ws"]
  FR-09: ["/inspect/records", "/inspect/records/{record_id}", "/inspect/records/{record_id}/report", "/inspect/experiments", "/inspect/tlcp/handshake"]
  FR-10: ["/admin/engine", "/admin/providers/reload", "/admin/benchmarks", "/admin/benchmarks/{benchmark_id}", "/admin/audit/export", "/admin/hole/posts/{post_id}/withdraw", "/admin/drops/{code}/destroy", "/admin/votes/{vote_id}/audit-flags"]
  FR-11: ["/me", "/me/password", "/me/keyring", "/me/certificate/verify", "/me/keyring/export", "/me/keyring/import", "/me/keyring/rotate", "/me/sessions", "/me/sessions/{session_id}", "/me/quotas", "/me/account", "/admin/users/{user_id}/quotas/reset", "/admin/users/{user_id}/status"]
x-time-format: RFC 3339 date-time，必须携带时区偏移；服务端统一按 UTC 存储
x-file-upload-limits:
  drop_file_bytes: 104857600
  seal_and_verify: 课程材料未规定固定字节数；部署限制必须通过 413 与中文错误返回
servers:
  - url: /api/v1
    description: 当前部署
tags:
  - name: System
  - name: Auth
  - name: Me
  - name: Drops
  - name: Hole
  - name: Votes
  - name: Verify
  - name: Chat
  - name: Inspect
  - name: Admin

paths:
  /system/status:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: 获取后端、密码引擎和 Provider 状态
      x-required-roles: [guest, student, admin, teacher]
      x-jwt: false
      x-sensitive-fields: []
      security: []
      responses:
        "200":
          description: 系统状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/register/request-code:
    post:
      tags: [Auth]
      operationId: requestRegistrationCode
      summary: 请求校园邮箱验证码
      x-required-roles: [guest]
      x-jwt: false
      x-sensitive-fields: [email, verification_code]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
      responses:
        "202":
          description: 已接受；无论邮箱是否已注册均返回相同结构
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 注册并生成密钥环和用户证书
      x-required-roles: [guest]
      x-jwt: false
      x-sensitive-fields: [password, verification_code, private_key, kek]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 登录并解锁会话密钥缓存
      x-required-roles: [guest]
      x-jwt: false
      x-sensitive-fields: [password, access_token, refresh_token, private_key, kek]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功；refresh token 通过 HttpOnly Cookie 设置
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: 使用 HttpOnly refresh cookie 轮换会话
      x-required-roles: [student, admin, teacher]
      x-jwt: false
      x-sensitive-fields: [refresh_token, access_token]
      security:
        - refreshCookie: []
      responses:
        "200":
          description: 轮换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 吊销当前 refresh token
      x-required-roles: [student, admin, teacher]
      x-jwt: false
      x-sensitive-fields: [refresh_token]
      security:
        - refreshCookie: []
      responses:
        "204":
          description: 已退出
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: 获取当前用户
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: [email]
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/password:
    patch:
      tags: [Me]
      operationId: changePassword
      summary: 验证旧口令并重新加密私钥
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: [current_password, new_password, private_key, kek]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, minLength: 1, writeOnly: true }
                new_password: { type: string, minLength: 10, maxLength: 128, pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{10,128}$", writeOnly: true }
      responses:
        "204": { description: 修改成功 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /me/pqc-mode:
    patch:
      tags: [Me]
      operationId: updatePqcMode
      summary: 更新全局抗量子模式偏好
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: 更新后的状态
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /me/keyring:
    get:
      tags: [Me]
      operationId: getKeyring
      summary: 获取密钥指纹和证书状态，不返回私钥
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: [private_key, kek]
      responses:
        "200":
          description: 密钥环摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/certificate/verify:
    get:
      tags: [Me]
      operationId: verifyOwnCertificate
      summary: 使用平台 CA 和最新 CRL 验证当前用户证书链
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      responses:
        "200":
          description: 当前用户证书链验证结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateVerificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /me/keyring/rotate:
    post:
      tags: [Me]
      operationId: rotateKeyring
      summary: 二次口令确认后轮换密钥并吊销旧证书
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: [password, private_key, kek]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, acknowledge_inflight_loss]
              properties:
                password: { type: string, writeOnly: true }
                acknowledge_inflight_loss: { const: true }
      responses:
        "200":
          description: 新密钥环摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /me/sessions:
    get:
      tags: [Me]
      operationId: listSessions
      summary: 获取登录设备列表
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: [ip]
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceSession" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/sessions/{session_id}:
    delete:
      tags: [Me]
      operationId: revokeSession
      summary: 远程登出指定设备
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: [refresh_token]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: 已吊销 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/quotas:
    get:
      tags: [Me]
      operationId: getQuotas
      summary: 获取当前 UTC 日的可展示服务额度
      description: 仅返回按日计数的树洞凭证、互动凭证和密信创建额度；投票凭证按 vote_id 计数，不适合汇总为单一当日额度。
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: []
      responses:
        "200":
          description: 额度
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /drops/text:
    post:
      tags: [Drops]
      operationId: createTextDrop
      summary: 创建文字密信
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: [content, access_password, session_key, private_key]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTextDropRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDropResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /drops/file:
    post:
      tags: [Drops]
      operationId: createFileDrop
      summary: 创建文件密信，最大 100 MiB
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: [file, access_password, session_key, private_key]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, ttl_policy, pqc_mode]
              properties:
                file: { type: string, format: binary }
                ttl_policy: { $ref: "#/components/schemas/TtlPolicy" }
                pqc_mode: { type: boolean }
                access_password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDropResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /drops/{code}:
    get:
      tags: [Drops]
      operationId: getDropMetadata
      summary: 公开获取密信元数据，不返回密文或明文
      x-required-roles: [guest, student, admin, teacher]
      x-jwt: false
      x-sensitive-fields: [ciphertext, plaintext, session_key]
      security: []
      parameters:
        - $ref: "#/components/parameters/DropCode"
      responses:
        "200":
          description: 元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropMetadata"
        "404":
          $ref: "#/components/responses/NotFound"

  /drops/{code}/extract:
    post:
      tags: [Drops]
      operationId: extractDrop
      summary: 使用提取码和可选口令解密密信
      x-required-roles: [guest, student, admin, teacher]
      x-jwt: false
      x-sensitive-fields: [access_code, access_password, plaintext, session_key, private_key]
      security: []
      parameters:
        - $ref: "#/components/parameters/DropCode"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [access_code]
              properties:
                access_code: { type: string, pattern: "^[A-Z0-9-]{8,32}$", writeOnly: true }
                access_password: { type: string, maxLength: 128, writeOnly: true }
      responses:
        "200":
          description: 文字密信或短内容
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractedDrop" }
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /hole/posts:
    get:
      tags: [Hole]
      operationId: listHolePosts
      summary: 浏览树洞帖子
      x-required-roles: [guest, student, admin, teacher]
      x-jwt: false
      x-sensitive-fields: [author_identity]
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 帖子列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HolePostPage"
    post:
      tags: [Hole]
      operationId: createHolePost
      summary: 消费一次性盲签名凭证发布帖子
      x-required-roles: [guest, student, admin, teacher]
      x-jwt: false
      x-sensitive-fields: [author_identity]
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHolePostRequest"
      responses:
        "201":
          description: 已发布
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HolePost" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /hole/credentials:
    post:
      tags: [Hole]
      operationId: issueHoleCredential
      summary: 对客户端提交的盲化消息签发匿名凭证
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: [user_id, unblinded_credential, blinding_factor]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlindCredentialRequest"
      responses:
        "201":
          description: 盲签名结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlindCredentialResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /hole/credentials/commitments:
    post:
      tags: [Hole]
      operationId: createHoleCommitment
      summary: 申领盲签名服务端一次性随机承诺 (ADR-0001)
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: [k_random, server_private_key]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlindCommitmentRequest"
      responses:
        "201":
          description: 服务端一次性承诺点与有效期
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlindCommitmentResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /votes:
    get:
      tags: [Votes]
      operationId: listVotes
      summary: 获取可见投票
      x-required-roles: [guest, student, admin, teacher]
      x-jwt: false
      x-sensitive-fields: [voter_identity]
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 投票列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotePage"
    post:
      tags: [Votes]
      operationId: createVote
      summary: 创建投票
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVoteRequest" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vote" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /votes/{vote_id}/credentials:
    post:
      tags: [Votes]
      operationId: issueVoteCredential
      summary: 每位用户每场投票签发一次盲化选票凭证
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: [user_id, ballot_choice, unblinded_credential, blinding_factor]
      parameters:
        - $ref: "#/components/parameters/VoteId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlindCredentialRequest" }
      responses:
        "201":
          description: 盲签名结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlindCredentialResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /votes/{vote_id}/credentials/commitments:
    post:
      tags: [Votes]
      operationId: createVoteBlindCommitment
      summary: 为单场投票申领一次性盲签承诺
      x-required-roles: [student, admin, teacher]
      x-jwt: true
      x-sensitive-fields: [k_random, server_private_key]
      parameters:
        - $ref: "#/components/parameters/VoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlindCommitmentRequest" }
      responses:
        "201":
          description: 本场投票的一次性承诺、公钥与有效期
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlindCommitmentResponse" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /votes/{vote_id}/ballots:
    post:
      tags: [Votes]
      operationId: submitBallot
      summary: 匿名提交并消费一次性选票
      x-required-roles: [guest, student, admin, teacher]
