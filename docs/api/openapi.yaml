    x-websocket:
      summary: 实时转发协商帧和加密消息帧；服务端不解密消息
      x-course-priority: advanced
      url: /api/v1/chat/ws
      security: >-
        Sec-WebSocket-Protocol 必须依次提供 cryptocampus.chat.v1 与
        auth.b64u.<base64url-no-padding(UTF-8 JWT)>；服务端协商响应只返回
        cryptocampus.chat.v1，禁止在查询字符串传递或回显 JWT
      roles: [student, admin, teacher]
      max-frame-bytes: 131072
      client-message:
        $ref: "#/components/schemas/ChatClientFrame"
      server-message:
        $ref: "#/components/schemas/ChatServerFrame"
      close-codes:
        "1000": 正常关闭
        "1008": 未认证、越权、序号重放或帧校验失败
        "1011": 服务端或密码引擎故障
      sensitive-fields: [message_plaintext, session_key, private_key, shared_secret]

