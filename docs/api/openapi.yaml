        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{user_id}/status:
    patch:
      tags: [Admin]
      operationId: updateUserStatus
      summary: 冻结或解冻用户并记录审计日志
      x-required-roles: [admin, teacher]
      x-jwt: true
      x-sensitive-fields: [refresh_token, private_key]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: { type: string, enum: [active, frozen] }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/users/{user_id}/role:
    patch:
      tags: [Admin]
      operationId: updateUserRole
      summary: 修改角色、吊销旧 Token 并留痕
      x-required-roles: [admin, teacher]
      x-jwt: true
      x-sensitive-fields: [refresh_token]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, reason]
              properties:
                role: { type: string, enum: [student, admin, teacher] }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{user_id}/quotas/reset:
    post:
      tags: [Admin]
      operationId: resetUserQuotas
      summary: 重置用户额度并记录审计日志
      x-required-roles: [admin, teacher]
      x-jwt: true
      x-sensitive-fields: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 重置后的额度
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/hole/posts/{post_id}/withdraw:
    post:
      tags: [Admin]
      operationId: withdrawHolePost
      summary: 撤下违规帖子并追加链式撤销记录
      x-required-roles: [admin, teacher]
      x-jwt: true
      x-sensitive-fields: [author_identity]
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: 撤销记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/drops/{code}/destroy:
    post:
      tags: [Admin]
      operationId: destroyDrop
      summary: 强制销毁密信密文；管理员不能解密内容
      x-required-roles: [admin, teacher]
      x-jwt: true
      x-sensitive-fields: [ciphertext, plaintext, session_key]
      parameters:
        - $ref: "#/components/parameters/DropCode"
      responses:
        "204": { description: 密文已销毁 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/votes/{vote_id}/audit-flags:
    post:
      tags: [Admin]
      operationId: flagVoteForAudit
      summary: 标记异常投票供审计，不改变匿名选票归属
      x-required-roles: [admin, teacher]
      x-jwt: true
      x-sensitive-fields: [voter_identity]
      parameters:
        - $ref: "#/components/parameters/VoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: 审计标记已记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/inspect-records:
    get:
      tags: [Admin]
      operationId: listInspectRecordMetadata
      summary: 查询他人透视记录元信息，不返回敏感中间值
      x-required-roles: [admin, teacher]
      x-jwt: true
      x-sensitive-fields: [plaintext, private_key, kek, session_key, full_intermediate_values]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 仅元信息分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectMetadataPage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/providers/reload:
    post:
      tags: [Admin]
      operationId: reloadPqcProvider
      summary: 演示重新加载 PQC Provider
      x-required-roles: [admin, teacher]
      x-jwt: true
      x-sensitive-fields: [provider_configuration_secret]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 重载后的 Provider 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/benchmarks/{benchmark_id}:
    get:
      tags: [Admin]
      operationId: getBenchmark
      summary: 获取均值、P99 和抗量子开销对比
      x-required-roles: [admin, teacher]
      x-jwt: true
      x-sensitive-fields: []
      parameters:
        - $ref: "#/components/parameters/BenchmarkId"
      responses:
        "200":
          description: 基准结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/benchmarks/{benchmark_id}/export:
    get:
      tags: [Admin]
      operationId: exportBenchmark
      summary: 导出已完成的性能基准结果
      x-required-roles: [admin, teacher]
      x-jwt: true
      x-sensitive-fields: []
      parameters:
        - $ref: "#/components/parameters/BenchmarkId"
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, json] }
      responses:
        "200":
          description: CSV 或 JSON 性能基准结果
          headers:
            Content-Disposition:
              description: 下载文件名
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/audit/export:
    get:
      tags: [Admin]
      operationId: exportAdminAudit
      summary: 导出经 SM3 链式哈希保护的管理员审计记录
      x-required-roles: [admin, teacher]
      x-jwt: true
      x-sensitive-fields: [plaintext, private_key, kek, session_key]
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, json] }
      responses:
        "200":
          description: CSV 或 JSON 审计导出
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/fair-blind/reveal-requests:
    post:
      tags: [Admin]
      operationId: createFairBlindRevealRequest
      summary: 创建公平盲签名联合揭示申请
      description: 课程进阶能力；单个管理员不能完成揭示，且不得用于普通盲签名凭证。
      x-course-priority: advanced
      x-required-roles: [admin, teacher]
      x-jwt: true
      x-sensitive-fields: [revealed_identity, escrow_share, private_key]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential_sn, reason]
              properties:
                credential_sn: { type: string, pattern: "^[A-Fa-f0-9]{32,}$" }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: 等待第二位管理员批准
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FairBlindRevealRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/fair-blind/reveal-requests/{reveal_request_id}/approve:
    post:
      tags: [Admin]
      operationId: approveFairBlindRevealRequest
      summary: 由第二位管理员批准并联合完成公平盲签名揭示
      x-course-priority: advanced
      x-required-roles: [admin, teacher]
      x-jwt: true
      x-sensitive-fields: [revealed_identity, escrow_share, private_key]
      parameters:
        - $ref: "#/components/parameters/RevealRequestId"
      responses:
        "200":
          description: 联合揭示结果；仅授权管理员可见并必须进入审计日志
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FairBlindRevealResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: cc_refresh

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DropCode:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9]{11,32}$" }
    VoteId:
      name: vote_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PostId:
      name: post_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SealId:
      name: seal_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecordId:
      name: record_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChatSessionId:
      name: chat_session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BenchmarkId:
      name: benchmark_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevealRequestId:
      name: reveal_request_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: 未认证、凭据错误或会话失效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 资源不存在或为防枚举隐藏存在性
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 状态冲突、重复消费或幂等冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: 字段校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: 额度或频率超限
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: 文件超过当前操作限制；密信文件的课程上限为 100 MiB
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: 密码引擎或 Provider 暂不可用
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: 请求语义、密码材料或状态不合法
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: 后端或密码引擎内部错误；消息不得包含密钥、明文或原始堆栈
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
      description: 规范化为小写并去除首尾空白的校园邮箱
    Role:
      type: string
      enum: [student, admin, teacher, system]
    UserStatus:
      type: string
      enum: [active, frozen, pending_deletion]
    Accepted:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: { const: true }
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, details]
      properties:
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]+$" }
        message: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, verification_code]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 10, maxLength: 128, pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{10,128}$", writeOnly: true }
        verification_code: { type: string, pattern: "^[0-9]{6}$", writeOnly: true }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
        device_name: { type: string, maxLength: 100 }
    AuthSession:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string, minLength: 1, x-sensitive: true }
        token_type: { const: bearer }
        expires_in: { type: integer, const: 7200 }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      additionalProperties: false
      required: [id, email, role, status, pqc_mode, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { $ref: "#/components/schemas/Email" }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }
        pqc_mode: { type: boolean }
        created_at: { type: string, format: date-time }
    SystemStatus:
      type: object
      additionalProperties: false
      required: [api, engine, version, tlcp, providers]
      properties:
        api: { type: string, enum: [ok, degraded] }
        engine: { type: string, enum: [online, offline, degraded] }
        version: { type: string }
        tlcp: { type: string, enum: [online, offline, unknown] }
        providers:
          type: object
          additionalProperties: { type: boolean }
    KeyringItem:
      type: object
      additionalProperties: false
      required: [kind, algorithm, fingerprint, status]
      properties:
        kind: { type: string, enum: [sm2_identity, certificate, ml_kem] }
        algorithm: { type: string }
        fingerprint: { type: string, description: SM3 指纹的脱敏展示 }
        status: { type: string, enum: [active, expired, revoked, unavailable] }
        expires_at: { type: [string, "null"], format: date-time }
    KeyringSummary:
      type: object
      additionalProperties: false
      required: [items, unlocked_until]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/KeyringItem" }
        unlocked_until: { type: [string, "null"], format: date-time }
    CertificateVerificationResponse:
      type: object
      additionalProperties: false
      required: [valid, state, serial, verified_at]
      properties:
        valid: { type: boolean }
        state: { type: string, enum: [active, expired, revoked, invalid] }
        serial: { type: [string, "null"] }
        verified_at: { type: string, format: date-time }
    DeviceSession:
      type: object
      additionalProperties: false
      required: [id, device, ip_masked, last_active_at, current]
      properties:
        id: { type: string, format: uuid }
        device: { type: string }
        ip_masked: { type: string }
        last_active_at: { type: string, format: date-time }
        current: { type: boolean }
    Quota:
      type: object
      additionalProperties: false
      required: [resource, used, limit]
      properties:
        resource: { type: string, enum: [hole_credential, interaction_credential, drop] }
        used: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
    QuotaPage:
      type: object
      additionalProperties: false
      required: [items, resets_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Quota" }
        resets_at: { type: string, format: date-time }
    TtlPolicy:
      type: string
      enum: [burn_after_read, hours_24, days_7]
    CreateTextDropRequest:
      type: object
      additionalProperties: false
      required: [content, ttl_policy, pqc_mode]
      properties:
        content: { type: string, minLength: 1, maxLength: 1048576 }
        ttl_policy: { $ref: "#/components/schemas/TtlPolicy" }
        pqc_mode: { type: boolean }
        access_password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
    CreateDropResponse:
      type: object
      additionalProperties: false
      required: [id, code, access_code, url, expires_at, pqc_mode]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        access_code: { type: string, minLength: 8, maxLength: 32, x-sensitive: true }
        url: { type: string, format: uri-reference }
        expires_at: { type: [string, "null"], format: date-time }
        pqc_mode: { type: boolean }
    DropMetadata:
      type: object
      additionalProperties: false
      required: [code, kind, status, requires_password, burn_after_read, expires_at]
      properties:
        code: { type: string }
        kind: { type: string, enum: [text, file] }
        status: { type: string, enum: [available, consumed, expired, destroyed, cooling_down] }
        requires_password: { type: boolean }
        burn_after_read: { type: boolean }
        filename: { type: [string, "null"] }
        size: { type: [integer, "null"], minimum: 0 }
        expires_at: { type: [string, "null"], format: date-time }
    ExtractedDrop:
      type: object
      additionalProperties: false
      required: [kind, signature_valid, certificate_valid, inspect_record_id]
      properties:
        kind: { type: string, enum: [text, file] }
        content: { type: string, description: 仅文字密信返回 }
        download_url: { type: string, format: uri-reference, description: 仅文件密信返回的短期一次性地址 }
        signature_valid: { type: boolean }
        certificate_valid: { type: boolean }
        inspect_record_id: { type: string, format: uuid }
    BlindCommitmentRequest:
      type: object
      additionalProperties: false
      required: [service, period]
      properties:
        service: { type: string, enum: [hole_post, hole_comment, hole_like, vote_ballot] }
        period: { type: string, minLength: 4, maxLength: 64 }
    BlindCommitmentResponse:
      type: object
      additionalProperties: false
      required: [commitment_id, commitment_point, expires_at, algorithm, signer_public_key]
      properties:
        commitment_id: { type: string }
        commitment_point: { type: string, contentEncoding: base64 }
        expires_at: { type: string, format: date-time }
        algorithm: { const: SM2-BLIND-PROTOCOL-V1 }
        signer_public_key: { type: string, contentEncoding: base64 }
    BlindCredentialRequest:
      type: object
      additionalProperties: false
      required: [service, period, blinded_message]
      properties:
        service: { type: string, enum: [hole_post, hole_comment, hole_like, vote_ballot] }
        period: { type: string, maxLength: 64 }
        blinded_message: { type: string, contentEncoding: base64 }
    BlindCredentialResponse:
      type: object
      additionalProperties: false
      required: [blind_signature, algorithm]
      properties:
        blind_signature: { type: string, contentEncoding: base64 }
        algorithm: { const: SM2-BLIND-PROTOCOL-V1 }
    CredentialProof:
      type: object
      additionalProperties: false
      required: [sn, service, period, signature]
      properties:
        sn: { type: string, pattern: "^[A-Fa-f0-9]{32,}$" }
        service: { type: string }
        period: { type: string }
        signature: { type: string, contentEncoding: base64 }
    CreateHolePostRequest:
      type: object
      additionalProperties: false
      required: [content, credential]
      properties:
        content: { type: string, minLength: 1, maxLength: 5000 }
        credential: { $ref: "#/components/schemas/CredentialProof" }
    HolePost:
      type: object
      additionalProperties: false
      required: [id, content, credential_prefix, credential_valid, status, created_at]
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        credential_prefix: { type: string }
        credential_valid: { type: boolean }
        status: { type: string, enum: [published, withdrawn] }
        created_at: { type: string, format: date-time }
    HolePostPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HolePost" } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    CreateVoteRequest:
      type: object
      additionalProperties: false
      required: [title, options, scope, closes_at]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        options:
          type: array
          minItems: 2
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [label]
            properties:
              label: { type: string, minLength: 1, maxLength: 100 }
        scope: { type: string, enum: [public, class, group] }
        scope_id:
          type: [string, "null"]
          format: uuid
          description: public 范围必须省略或为 null；class/group 范围必须提供同类型且当前用户属于其中的范围 ID。
        closes_at: { type: string, format: date-time }
    Vote:
      type: object
      additionalProperties: false
      required: [id, title, options, scope, status, closes_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        options:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
        scope: { type: string }
        status: { type: string, enum: [open, closed, published] }
        closes_at: { type: string, format: date-time }
    VotePage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Vote" } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    SubmitBallotRequest:
      type: object
      additionalProperties: false
      required: [option_id, credential]
      properties:
        option_id: { type: string, format: uuid }
        credential: { $ref: "#/components/schemas/CredentialProof" }
    VoteResult:
      type: object
      additionalProperties: false
      required: [vote_id, counts, total, signature, signer_certificate, published_at]
      properties:
        vote_id: { type: string, format: uuid }
        counts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        signature: { type: string, contentEncoding: base64 }
        signer_certificate: { type: string, contentEncoding: base64 }
        published_at: { type: string, format: date-time }
    Seal:
      type: object
      additionalProperties: false
      required: [id, digest_algorithm, digest, signature_algorithm, signature, certificate, timestamp]
      properties:
        id: { type: string, format: uuid }
        digest_algorithm: { const: SM3 }
        digest: { type: string, contentEncoding: base64 }
        signature_algorithm: { type: string, enum: [SM3-with-SM2, ML-DSA-65] }
        signature: { type: string, contentEncoding: base64 }
        certificate: { type: string, contentEncoding: base64 }
        timestamp: { type: string, format: date-time }
    VerificationStep:
      type: object
      additionalProperties: false
      required: [name, passed, message]
      properties:
        name: { type: string, enum: [digest, signature, certificate_chain, timestamp, revocation] }
        passed: { type: boolean }
        message: { type: string }
    VerificationResult:
      type: object
      additionalProperties: false
      required: [valid, steps, record_digest]
      properties:
        valid: { type: boolean }
        steps: { type: array, items: { $ref: "#/components/schemas/VerificationStep" } }
        record_digest: { type: string }
    InspectStep:
      type: object
      additionalProperties: false
      required: [order, name, algorithm, result, redacted_values]
      properties:
        order: { type: integer, minimum: 1 }
        name: { type: string }
        algorithm: { type: string }
        result: { type: string, enum: [passed, failed, skipped] }
        redacted_values: { type: object, additionalProperties: true }
    InspectRecord:
      type: object
      additionalProperties: false
      required: [id, operation, owner, steps, created_at]
      properties:
        id: { type: string, format: uuid }
        operation: { type: string }
        owner: { type: string, enum: [self, other, system] }
        steps: { type: array, items: { $ref: "#/components/schemas/InspectStep" } }
        created_at: { type: string, format: date-time }
    Job:
      type: object
      additionalProperties: false
      required: [id, status, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, completed, failed] }
        created_at: { type: string, format: date-time }

    Notification:
      type: object
      additionalProperties: false
      required: [id, type, title, read, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [drop_extracted, security, system] }
        title: { type: string, minLength: 1, maxLength: 200 }
        related_resource_id: { type: [string, "null"] }
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    CredentialVerification:
      type: object
      additionalProperties: false
      required: [valid, service, period, consumed, revoked]
      properties:
        valid: { type: boolean }
        service: { type: string, enum: [hole_post, hole_comment, hole_like, vote_ballot] }
        period: { type: string }
        consumed: { type: boolean }
        revoked: { type: boolean }
    CreateHoleCommentRequest:
      type: object
      additionalProperties: false
      required: [content, credential]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
        credential: { $ref: "#/components/schemas/CredentialProof" }
    HoleComment:
      type: object
      additionalProperties: false
      required: [id, post_id, content, credential_prefix, credential_valid, created_at]
      properties:
        id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        content: { type: string }
        credential_prefix: { type: string }
        credential_valid: { type: boolean }
        created_at: { type: string, format: date-time }
    HoleCommentPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HoleComment" } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    RevocationEntry:
      type: object
      additionalProperties: false
      required: [sn, reason, hash_prev, hash_curr, timestamp]
      properties:
        sn: { type: string, pattern: "^[A-Fa-f0-9]{32,}$" }
        reason: { type: string, maxLength: 500 }
        hash_prev: { type: string, contentEncoding: base64 }
        hash_curr: { type: string, contentEncoding: base64 }
        timestamp: { type: string, format: date-time }
    RevocationPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RevocationEntry" } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    SignatureVerification:
      type: object
      additionalProperties: false
      required: [valid, algorithm, certificate_valid, message]
      properties:
        valid: { type: boolean }
        algorithm: { type: string, enum: [SM3-with-SM2, ML-DSA-65] }
        certificate_valid: { type: boolean }
        message: { type: string }
    VoteAuditBallot:
      type: object
      additionalProperties: false
      required: [sn, signature, valid]
      properties:
        sn: { type: string, pattern: "^[A-Fa-f0-9]{32,}$" }
        signature: { type: string, contentEncoding: base64 }
        valid: { type: boolean }
    VoteAuditReport:
      type: object
      additionalProperties: false
      required: [vote_id, ballots, total, result_signature]
      properties:
        vote_id: { type: string, format: uuid }
        ballots: { type: array, items: { $ref: "#/components/schemas/VoteAuditBallot" } }
        total: { type: integer, minimum: 0 }
        result_signature: { type: string, contentEncoding: base64 }
    ChatSession:
      type: object
      additionalProperties: false
      required: [id, peer_user_id, pqc_mode, key_agreement, peer_key_bundle, created_at]
      properties:
        id: { type: string, format: uuid }
        peer_user_id: { type: string, format: uuid }
        pqc_mode: { type: boolean }
        key_agreement: { type: string, enum: [SM2-ECDH, X25519-ML-KEM-768] }
        peer_key_bundle:
          type: object
          additionalProperties: false
          required: [sm2_certificate]
          properties:
            sm2_certificate: { type: string, contentEncoding: base64 }
            ml_kem_public_key: { type: [string, "null"], contentEncoding: base64 }
        created_at: { type: string, format: date-time }
    EncryptedMessage:
      type: object
      additionalProperties: false
      required: [type, id, session_id, sender_id, sequence, ciphertext, nonce, tag, signature, created_at]
      properties:
        type: { const: encrypted_message }
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        ciphertext: { type: string, contentEncoding: base64 }
        nonce: { type: string, contentEncoding: base64 }
        tag: { type: string, contentEncoding: base64 }
        signature: { type: string, contentEncoding: base64 }
        created_at: { type: string, format: date-time }
    EncryptedMessagePage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EncryptedMessage" } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    ChatClientFrame:
      oneOf:
        - $ref: "#/components/schemas/ChatHandshakeInput"
        - $ref: "#/components/schemas/ChatEncryptedMessageInput"
    ChatServerFrame:
      oneOf:
        - $ref: "#/components/schemas/ChatHandshakeRelay"
        - $ref: "#/components/schemas/EncryptedMessage"
        - $ref: "#/components/schemas/ChatErrorFrame"
    ChatHandshakeInput:
      type: object
      additionalProperties: false
      required: [type, session_id, payload]
      properties:
        type: { const: handshake }
        session_id: { type: string, format: uuid }
        payload: { type: string, contentEncoding: base64, maxLength: 10924, description: 仅转发公开临时公钥或 KEM 密文，解码后不超过 8192 字节 }
    ChatHandshakeRelay:
      type: object
      additionalProperties: false
      required: [type, session_id, sender_id, payload]
      properties:
        type: { const: handshake }
        session_id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        payload: { type: string, contentEncoding: base64, maxLength: 10924 }
    ChatEncryptedMessageInput:
      type: object
      additionalProperties: false
      required: [type, session_id, sequence, ciphertext, nonce, tag, signature]
      properties:
        type: { const: encrypted_message }
        session_id: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        ciphertext: { type: string, contentEncoding: base64, maxLength: 87384, description: 解码后 1 至 65536 字节 }
        nonce: { type: string, contentEncoding: base64, description: 解码后固定 12 字节 }
        tag: { type: string, contentEncoding: base64, description: 解码后固定 16 字节 }
        signature: { type: string, contentEncoding: base64, maxLength: 5464, description: 解码后 1 至 4096 字节；服务端不验签 }
    ChatErrorFrame:
      type: object
      additionalProperties: false
      required: [type, code, message]
      properties:
        type: { const: error }
        code:
          type: string
          enum: [INVALID_FRAME, FORBIDDEN, DUPLICATE_SEQUENCE, INTERNAL_ERROR]
        message: { type: string, maxLength: 128 }
    InspectRecordPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InspectRecord" } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    InspectMetadata:
      type: object
      additionalProperties: false
      required: [id, operation, owner_user_id, created_at]
      properties:
        id: { type: string, format: uuid }
        operation: { type: string }
        owner_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    InspectMetadataPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InspectMetadata" } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    ExperimentRequest:
      type: object
      additionalProperties: false
      required: [experiment, input]
      properties:
        experiment:
          type: string
          enum: [sm4_mode_compare, sm3_avalanche, sm2_curve, ecdh, ml_kem, ml_dsa, kat]
        input:
          type: string
          maxLength: 1048576
          description: 仅课程试验数据，不得提交真实业务明文或密钥
    ExperimentResult:
      type: object
      additionalProperties: false
      required: [experiment, passed, steps, redacted_values]
      properties:
        experiment: { type: string }
        passed: { type: boolean }
        steps: { type: array, items: { type: string } }
        redacted_values: { type: object, additionalProperties: true }
    TlcpHandshake:
      type: object
      additionalProperties: false
      required: [protocol, cipher_suite, signing_certificate, encryption_certificate, messages]
      properties:
        protocol: { const: TLCP }
        cipher_suite: { type: string }
        signing_certificate: { type: string, description: 脱敏证书摘要 }
        encryption_certificate: { type: string, description: 脱敏证书摘要 }
        messages: { type: array, items: { type: string } }
    UserPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    BenchmarkMetric:
      type: object
      additionalProperties: false
      required: [operation, mean_ms, p99_ms]
      properties:
        operation: { type: string }
        mean_ms: { type: number, minimum: 0 }
        p99_ms: { type: number, minimum: 0 }
        pqc_overhead_percent: { type: [number, "null"] }
    BenchmarkResult:
      type: object
      additionalProperties: false
      required: [id, status, metrics, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, completed, failed] }
        metrics: { type: array, items: { $ref: "#/components/schemas/BenchmarkMetric" } }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [actor_id, action, target, detail_hash, hash_prev, hash_curr, timestamp]
      properties:
        actor_id: { type: string, format: uuid }
        action: { type: string }
        target: { type: string }
        detail_hash: { type: string, contentEncoding: base64 }
        hash_prev: { type: string, contentEncoding: base64 }
        hash_curr: { type: string, contentEncoding: base64 }
        timestamp: { type: string, format: date-time }
    FairBlindRevealRequest:
      type: object
      additionalProperties: false
      required: [id, credential_sn, requester_id, status, created_at]
      properties:
        id: { type: string, format: uuid }
        credential_sn: { type: string, pattern: "^[A-Fa-f0-9]{32,}$" }
        requester_id: { type: string, format: uuid }
        status: { type: string, enum: [pending_second_approval, approved, rejected] }
        created_at: { type: string, format: date-time }
    FairBlindRevealResult:
      type: object
      additionalProperties: false
      required: [request_id, revealed_user_id, approved_by, revealed_at]
      properties:
        request_id: { type: string, format: uuid }
        revealed_user_id: { type: string, format: uuid, description: 仅公平盲签名进阶模式可返回 }
        approved_by:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items: { type: string, format: uuid }
        revealed_at: { type: string, format: date-time }

security:
  - bearerAuth: []
